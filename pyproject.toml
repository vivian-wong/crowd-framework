# This file defines the Python package 'st_dif'.
# It is used by pip and other tools to understand what your project is and what it needs.

[build-system]
# These are the basic tools needed to build your package.
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# Core metadata for your package.
name = "st_dif"
version = "0.1.1"
description = "A library for crowdflow prediction!"
authors = [
  { name="Vivian Wong", email="vivian.wong@ufl.edu" },
]
readme = "README.md"
requires-python = ">=3.10"

# These are the runtime dependencies.
# This list serves as the canonical declaration of what your package needs to run.
# The CI workflow installs these in a specific order to handle complex build requirements.
dependencies = [
  "torch>=2.5",
  "numpy>=2.0",
  "pandas==2.2.3",
  "torch_geometric==2.3",
  "torch_geometric_temporal",
  "torch_scatter",
  "torch_sparse",
  "matplotlib",
  "seaborn",
  "opencv-python",
  "tqdm",
  "configparser",
  "argparse",
  "ipykernel",
]

[project.optional-dependencies]
# Dependencies for developers (e.g., for running tests and formatting code).
dev = [
  "pytest>=7.0",
  "black>=22.0",
  "mypy>=1.0"
]

[tool.setuptools.packages.find]
# This tells setuptools to find your package code in the 'src' directory.
where = ["src"]
