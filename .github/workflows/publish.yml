# .github/workflows/publish.yml
# This workflow builds and publishes the package to PyPI when a new release is created.

name: Publish Python Package

on:
  release:
    types: [published]

jobs:
  deploy:
    # This job runs in the 'pypi' environment you created.
    environment:
      name: pypi
      url: https://pypi.org/p/st-dif
    runs-on: ubuntu-latest
    # These permissions are required for trusted publishing.
    permissions:
      id-token: write

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install build tools
      run: python -m pip install --upgrade build

    - name: Build package
      run: python -m build

    - name: Publish package to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
