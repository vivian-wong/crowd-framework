# .github/workflows/ci.yml
# This workflow automates the installation and basic testing of your package.

name: CI

# 1. TRIGGERS: This workflow runs on pushes or pull requests to the 'master' branch.
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    # Use a matrix to run the job on Ubuntu, macOS, and Windows
    runs-on: ${{ matrix.os }}
    strategy:
      # Prevent all jobs from failing if one fails
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: [3.10, 3.11, 3.12]

    steps:
    - uses: actions/checkout@v3
    - name: Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - run: which python

    # INSTALLATION: 
    - name: Upgrade pip
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade setuptools
        pip install wheel

    - name: Install all dependencies
      shell: bash
      run: |
        chmod +x install_dependencies.sh
        ./install_dependencies.sh

    - name: Install local package
      run: pip install -e .[dev]

    - name: Test package
      run: |
        python -m pytest